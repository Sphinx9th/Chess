<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catur: Lawan Komputer atau Teman</title>
<style>
:root{--bg:#171b2b;--panel:#20263b;--ink:#e8ebf5;--mute:#8d97b5;--l:#cfd6ea;--d:#6a79a6;--hl:#f2c14e;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif;display:flex;justify-content:center;padding:16px}
.wrap{display:grid;grid-template-columns:auto 300px;gap:20px;align-items:start}
@media(max-width:880px){.wrap{grid-template-columns:1fr}}
.bd{display:flex;flex-direction:column;gap:8px;position:relative}
#board{--s:min(92vw,560px);width:var(--s);height:var(--s);display:grid;grid-template-columns:repeat(8,1fr);border-radius:6px;overflow:hidden}
.sq{position:relative;display:flex;align-items:center;justify-content:center;font-size:calc(var(--s)/8*.8);line-height:1;cursor:pointer;user-select:none}
.sq.l{background:var(--l)}.sq.d{background:var(--d)}
.sq.last{box-shadow:inset 0 0 0 100px rgba(242,193,78,.45)}
.sq.sel{box-shadow:inset 0 0 0 100px rgba(242,193,78,.8)}
.sq.chk{box-shadow:inset 0 0 0 100px rgba(255,107,107,.75)}
.sq.t::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(23,27,43,.35)}
.sq.t.c::after{width:92%;height:92%;background:none;border:5px solid rgba(23,27,43,.35)}
.w{color:#fff;text-shadow:0 0 3px #000,0 2px 2px rgba(0,0,0,.5)}
.b{color:#151827;text-shadow:0 0 2px rgba(255,255,255,.55)}
.sq i{position:absolute;font:600 10px system-ui;font-style:normal;opacity:.85}
.sq i.r{top:2px;left:3px}.sq i.f{bottom:1px;right:3px}
.sq.l i{color:var(--d)}.sq.d i{color:var(--l)}
.clock{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:8px;background:var(--panel);opacity:.6}
.clock.on{opacity:1;box-shadow:inset 0 0 0 2px var(--hl)}
.clock.low b{color:var(--bad)}
.clock b{font:600 26px ui-monospace,monospace;font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font:700 26px Georgia,serif}
.row{display:flex;gap:8px;flex-wrap:wrap}
select,button{font:inherit;color:var(--ink);background:#2b3350;border:1px solid #3b4568;border-radius:7px;padding:7px 10px;cursor:pointer}
select{flex:1}
button:hover{background:#34406a}
button:focus-visible,select:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
#status{min-height:22px;font-weight:600}
#moves{height:220px;overflow:auto;list-style:none;margin:0;padding:0;background:#181d30;border-radius:8px}
#moves li{display:grid;grid-template-columns:36px 1fr 1fr;padding:3px 8px;font:14px ui-monospace,monospace}
#moves li span{color:var(--mute)}
#moves b{font-weight:500;padding:0 4px;border-radius:4px}
#moves b.now{background:var(--hl);color:#171b2b}
#promo{position:absolute;inset:0;margin:auto;width:max-content;height:max-content;display:flex;gap:6px;padding:10px;background:var(--panel);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.6)}
#promo[hidden]{display:none}
#promo button{font-size:44px;line-height:1;padding:6px 10px}
.hide{display:none}
</style>
</head>
<body>
<main class="wrap">
  <section class="bd">
    <div class="clock" id="ct"><span></span><b></b></div>
    <div id="board" aria-label="Papan catur"></div>
